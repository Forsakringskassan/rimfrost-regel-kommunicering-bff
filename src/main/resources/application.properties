# Port - same default as rimfrost-template-micro-fe-bff
quarkus.http.port=9005

# Full backend base URL, including the rule path. Must not include a trailing slash.
quarkus.rest-client.backend.url=${BACKEND_URL:http://localhost:8080/regel/kommunicering}

# Make the generated openapi models visible to Quarkus (reflection, validation)
quarkus.index-dependency.kommunicering-openapi.group-id=se.fk.rimfrost.regel.kommunicering
quarkus.index-dependency.kommunicering-openapi.artifact-id=rimfrost-regel-kommunicering-openapi-jaxrs-spec
quarkus.index-dependency.kommuniceringsutfall-openapi.group-id=se.fk.rimfrost.framework.regel.kommuniceringsutfall
quarkus.index-dependency.kommuniceringsutfall-openapi.artifact-id=rimfrost-framework-regel-kommuniceringsutfall-openapi-jaxrs-spec
quarkus.index-dependency.uppgiftskommentar-openapi.group-id=se.fk.rimfrost.framework.regel.uppgiftskommentar
quarkus.index-dependency.uppgiftskommentar-openapi.artifact-id=rimfrost-framework-regel-uppgiftskommentar-openapi-jaxrs-spec

# CORS - allow the frontend to call this BFF
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:3030}
quarkus.http.cors.methods=GET,PUT,POST,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization
# Off by default — enable per environment if the frontend needs to send cookies cross-origin
quarkus.http.cors.access-control-allow-credentials=${CORS_ALLOW_CREDENTIALS:false}

# Informationsaccess events via ILogg — static topic (IA-FR-09.2)
# Kafka address comes from KAFKA_BOOTSTRAP_SERVERS in the environment
#
mp.messaging.outgoing.ilogg-event.connector=smallrye-kafka
mp.messaging.outgoing.ilogg-event.topic=informationsaccess
mp.messaging.outgoing.ilogg-event.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# Container image
quarkus.container-image.build=false
quarkus.container-image.name=rimfrost-regel-kommunicering-bff
quarkus.container-image.group=rimfrost
quarkus.container-image.tag=latest
quarkus.container-image.push=false
